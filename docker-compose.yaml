services:
  # The PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: shap_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shap_explainer_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shap_net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d shap_explainer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Backend API Service
  backend:
    build:
      context: ./backend # Build from the backend directory
      dockerfile: Dockerfile
    container_name: shap_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy # Wait for db to be healthy
    environment:
      # Use the 'db' service name as the hostname
      DATABASE_URL: "postgresql+asyncpg://user:password@db:5432/shap_explainer_db"
      # Prevent `uv run` from downloading a different CPython at container start
      UV_PYTHON: "/usr/local/bin/python"
      LOG_LEVEL: "DEBUG"
    networks:
      - shap_net
    expose:
      - "8000"
    # Optional GPU configuration (enable via docker-compose.gpu.yaml)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # The Frontend Service (Nginx)
  frontend:
    build:
      context: ./web # Build from the web directory
      dockerfile: Dockerfile
    container_name: shap_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Map host port 80 to container port 80
      # This allows access to the app at http://localhost
      - "80:80"
    networks:
      - shap_net

networks:
  shap_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
